<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="/calculator/favicon.ico">
    <link rel="stylesheet" href="/calculator/assets/style-BAU9KQgR.css">
    <script type="module" src="/calculator/assets/script-CUIGyJ2o.js"></script>
  </head>
  <body>
    <div class="calculator">
      <div class="calculator__screen">
        <div class="calculator__input calculator__input--previous"></div>
        <div class="calculator__input calculator__input--current">0</div>
      </div>

      <div class="calculator__buttons">
        <button class="calculator__btn calculator__btn--clear" data-action="clear">ac</button>
        <button class="calculator__btn calculator__btn--delete" data-action="delete">del</button>

        <button class="calculator__btn calculator__btn--digit" data-digit="7">7</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="8">8</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="9">9</button>
        <button class="calculator__btn calculator__btn--operator" data-operator="divide">÷</button>

        <button class="calculator__btn calculator__btn--digit" data-digit="4">4</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="5">5</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="6">6</button>
        <button class="calculator__btn calculator__btn--operator" data-operator="multiply">×</button>

        <button class="calculator__btn calculator__btn--digit" data-digit="1">1</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="2">2</button>
        <button class="calculator__btn calculator__btn--digit" data-digit="3">3</button>
        <button class="calculator__btn calculator__btn--operator" data-operator="subtract">−</button>

        <button class="calculator__btn calculator__btn--digit" data-digit="0">0</button>
        <button class="calculator__btn calculator__btn--decimal-point" data-decimal-point=".">.</button>
        <button class="calculator__btn calculator__btn--evaluate" data-action="evaluate">=</button>
        <button class="calculator__btn calculator__btn--operator" data-operator="add">+</button>
      </div>
    </div>
  </body>
</html>
